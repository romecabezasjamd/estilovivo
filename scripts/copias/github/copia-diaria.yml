# Copia de seguridad diaria de Estilo Vivo guardada en este repositorio PRIVADO como "Release".
# Las copias van cifradas (AES-256-GCM): sin BACKUP_PASSWORD nadie puede abrirlas, tampoco GitHub.
# Se conservan las 30 más recientes; las anteriores se borran del todo (Release + etiqueta), sin quedar en el historial.
#
# Necesita en Settings › Secrets and variables › Actions:
#   BACKUP_TOKEN  (secreto, el mismo que en Coolify)
#   BACKUP_URL    (opcional, variable o secreto; por defecto https://estilovivo.xyoncloud.win/api/admin/backup)
# Si falla, GitHub te envía un correo. También se puede lanzar a mano: Actions › Copia diaria › Run workflow.
name: Copia diaria

on:
  schedule:
    - cron: '17 3 * * *' # cada día a las 03:17 UTC (04:17 en invierno en España)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copia-diaria
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONSERVAR: 30
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Descargar la copia del servidor
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          BACKUP_URL: ${{ vars.BACKUP_URL || secrets.BACKUP_URL || 'https://estilovivo.xyoncloud.win/api/admin/backup' }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_TOKEN}" ]; then
            echo "::error::Falta el secreto BACKUP_TOKEN (Settings › Secrets and variables › Actions)."
            exit 1
          fi
          NOMBRE="estilovivo-copia-$(date -u +%Y%m%d-%H%M%S).evbk"
          echo "NOMBRE=$NOMBRE" >> "$GITHUB_ENV"
          CODIGO=$(curl -sS -o "$NOMBRE" -w '%{http_code}' --retry 3 --retry-delay 30 --retry-all-errors --max-time 3000 \
            -H "Authorization: Bearer ${BACKUP_TOKEN}" -H "User-Agent: estilovivo-copias" "$BACKUP_URL" || echo "000")
          case "$CODIGO" in
            200) ;;
            401) echo "::error::El servidor no acepta el token (401): BACKUP_TOKEN no coincide con el de Coolify."; exit 1 ;;
            404) echo "::error::Las copias no están activadas en el servidor (404): faltan BACKUP_TOKEN o BACKUP_PASSWORD en Coolify, o no se ha desplegado."; exit 1 ;;
            403) echo "::error::El servidor o Cloudflare ha bloqueado la petición (403)."; exit 1 ;;
            429) echo "::error::Demasiadas copias seguidas (429). Se reintentará mañana."; exit 1 ;;
            *) echo "::error::No se pudo descargar la copia (código $CODIGO)."; exit 1 ;;
          esac
          TAMANO=$(stat -c %s "$NOMBRE")
          if [ "$TAMANO" -lt 1024 ] || [ "$(head -c 6 "$NOMBRE")" != "EVBK1" ]; then
            echo "::error::El archivo descargado no es una copia válida ($TAMANO bytes)."
            exit 1
          fi
          echo "Copia descargada: $NOMBRE ($TAMANO bytes)"

      - name: Guardar la copia como Release
        run: |
          set -euo pipefail
          ETIQUETA="${NOMBRE%.evbk}"
          gh release create "$ETIQUETA" "$NOMBRE" --repo "$GITHUB_REPOSITORY" \
            --title "Copia $(date -u '+%d/%m/%Y %H:%M') UTC" \
            --notes "Copia de seguridad cifrada de Estilo Vivo. Para abrirla: node server/scripts/restaurar-copia.mjs $NOMBRE <carpeta> (pide BACKUP_PASSWORD)."
          rm -f "$NOMBRE"

      - name: Borrar las copias de más de las ${{ env.CONSERVAR }} últimas
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq '.[].tagName | select(startswith("estilovivo-copia-"))' | sort -r | tail -n +$((CONSERVAR + 1)) |
          while read -r vieja; do
            echo "Borrando copia antigua: $vieja"
            gh release delete "$vieja" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
